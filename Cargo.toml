[package]
name = "filego"
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
description = "A lightweight Windows folder launcher"
license = "MIT"
repository = "https://github.com/yorelll/filego"
readme = "README.md"
publish = false
build = "build.rs"

[features]
default = []

[dependencies]
chrono = { version = "=0.4.45", features = ["clock", "serde"] }
pinyin = { version = "=0.11.0", default-features = false, features = ["plain"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
slint = { version = "=1.18.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "accessibility",
    "system-tray",
] }
uuid = { version = "=1.26.1", features = ["serde", "v4"] }

[build-dependencies]
slint-build = "=1.18.0"
winresource = "=0.1.31"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
