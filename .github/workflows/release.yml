name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (must match Cargo.toml)
        required: true
        type: string
      candidate_sha:
        description: Full 40-character reviewed commit SHA
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  package:
    name: Validate and package exact candidate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Validate dispatch inputs
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "version must use semantic numeric form such as 0.0.1"
          }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "candidate_sha must be a full 40-character commit SHA"
          }

      - name: Check out exact candidate
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA.ToLowerInvariant()) {
            throw "Checked out '$actual', expected '$env:CANDIDATE_SHA'"
          }

      - name: Remap compiler source paths
        shell: pwsh
        run: |
          # Rust embeds panic locations from the workspace and registry even
          # in stripped release binaries. Use stable, non-host paths so the
          # portable candidate does not disclose the build machine layout.
          # CI places the registry under USERPROFILE; add the workspace parent
          # too because generated Slint sources live under target/.
          $registry = Join-Path $env:USERPROFILE ".cargo\registry\src"
          $workspaceParent = Split-Path $env:GITHUB_WORKSPACE -Parent
          $flags = @(
            "--remap-path-prefix=$env:GITHUB_WORKSPACE=/filego",
            "--remap-path-prefix=$workspaceParent=/workspace",
            "--remap-path-prefix=$registry=/cargo/registry/src",
            "--remap-path-prefix=$env:USERPROFILE=/build-user"
          )
          "CARGO_ENCODED_RUSTFLAGS=$($flags -join [char]0x1f)" |
            Add-Content -Path $env:GITHUB_ENV -Encoding utf8

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action commit
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy, llvm-tools-preview
          targets: x86_64-pc-windows-msvc

      # Lockfile validation must precede rust-cache because the cache action reads
      # Cargo metadata and could otherwise resolve a missing lockfile.
      - name: Require immutable dependencies and release notices
        shell: pwsh
        run: |
          if (-not (Test-Path "Cargo.lock" -PathType Leaf)) { throw "Cargo.lock is required" }
          if (-not (Test-Path "about.toml" -PathType Leaf)) { throw "about.toml is required" }
          if (-not (Test-Path "about.hbs" -PathType Leaf)) { throw "about.hbs is required" }
          cargo metadata --frozen --format-version 1 --no-deps > $null

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: release-windows-x86_64-msvc
          cache-on-failure: false

      - name: Verify requested version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $metadata = cargo metadata --frozen --format-version 1 --no-deps | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "filego" }
          if ($null -eq $package) { throw "filego package was not found" }
          if ($package.version -ne $env:VERSION) {
            throw "Cargo version '$($package.version)' does not match requested '$env:VERSION'"
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --all-features --locked --target x86_64-pc-windows-msvc -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked --target x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --workspace --all-features --release --locked --target x86_64-pc-windows-msvc

      - name: Verify version helper
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $actual = (& "target\x86_64-pc-windows-msvc\release\filego-version.exe").Trim()
          if ($actual -ne "FileGo $env:VERSION") {
            throw "Version mismatch: '$actual'"
          }

      - name: Install pinned dependency audit tools
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
          fallback: none
          checksum: true

      - name: Audit dependency policy
        run: cargo deny --locked check advisories bans licenses sources

      - name: Generate third-party licenses
        run: cargo about generate --locked --fail --all-features --target x86_64-pc-windows-msvc --output-file THIRD_PARTY_LICENSES.html about.hbs

      - name: Sanity-check third-party license inventory
        shell: pwsh
        run: |
          $notice = Get-Content "THIRD_PARTY_LICENSES.html" -Raw
          if ([string]::IsNullOrWhiteSpace($notice)) { throw "License inventory is empty" }
          if ($notice -notmatch '<title>FileGo Third-Party Licenses</title>') { throw "License inventory title is missing" }

      - name: Strip and verify portable executable
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $rawExe = "target\x86_64-pc-windows-msvc\release\filego.exe"
          if (-not (Test-Path $rawExe -PathType Leaf)) { throw "Missing $rawExe" }

          # MSVC may create filego.pdb beside the transient target executable.
          # That intermediate is allowed, but the portable staging directory and
          # uploaded candidate must contain neither a PDB nor a PE debug directory.
          $sysroot = (& rustc --print sysroot).Trim()
          if ([string]::IsNullOrWhiteSpace($sysroot)) { throw "rustc did not report a sysroot" }
          $llvmBin = Join-Path $sysroot "lib\rustlib\$env:TARGET\bin"
          $objcopy = Join-Path $llvmBin "llvm-objcopy.exe"
          $objdump = Join-Path $llvmBin "llvm-objdump.exe"
          foreach ($tool in @($objcopy, $objdump)) {
            if (-not (Test-Path $tool -PathType Leaf)) {
              throw "Required llvm-tools-preview executable is missing: $tool"
            }
          }
          & $objcopy --version
          if ($LASTEXITCODE -ne 0) { throw "llvm-objcopy version check failed" }
          & $objdump --version
          if ($LASTEXITCODE -ne 0) { throw "llvm-objdump version check failed" }

          $stage = "dist\staging\FileGo-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $portableExe = Join-Path $stage "FileGo.exe"
          Copy-Item $rawExe $portableExe

          # Strip the staging copy in place, not target output, so diagnostics
          # remain available during compilation while only the verified portable
          # binary becomes a package input.
          & $objcopy --strip-debug $portableExe
          if ($LASTEXITCODE -ne 0) { throw "llvm-objcopy --strip-debug failed" }

          # A PDB can exist under target/, but no PDB is allowed under portable
          # staging. Remove any accidental staged copy, then verify it is absent.
          Get-ChildItem -Path $stage -Filter "*.pdb" -File -Recurse |
            Remove-Item -Force
          $stagedPdb = Get-ChildItem -Path $stage -Filter "*.pdb" -File -Recurse
          if ($stagedPdb) { throw "PDB found in portable staging" }
          if (-not (Test-Path $portableExe -PathType Leaf)) { throw "Stripped executable is missing" }

          # Parse PE headers directly. The debug data directory is index 6 in
          # both PE32 and PE32+; absence of a sibling .pdb alone is insufficient.
          function Read-UInt16LE {
            param([byte[]] $Bytes, [int] $Offset, [string] $Label)
            if ($Offset -lt 0 -or $Offset + 2 -gt $Bytes.Length) { throw "Malformed PE: truncated $Label" }
            return [BitConverter]::ToUInt16($Bytes, $Offset)
          }
          function Read-UInt32LE {
            param([byte[]] $Bytes, [int] $Offset, [string] $Label)
            if ($Offset -lt 0 -or $Offset + 4 -gt $Bytes.Length) { throw "Malformed PE: truncated $Label" }
            return [BitConverter]::ToUInt32($Bytes, $Offset)
          }
          function Find-ByteSequence {
            param([byte[]] $Haystack, [byte[]] $Needle)
            if ($Needle.Length -eq 0) { throw "Binary scan marker must not be empty" }
            $last = $Haystack.Length - $Needle.Length
            for ($index = 0; $index -le $last; $index++) {
              if ($Haystack[$index] -ne $Needle[0]) { continue }
              $matches = $true
              for ($needleIndex = 1; $needleIndex -lt $Needle.Length; $needleIndex++) {
                if ($Haystack[$index + $needleIndex] -ne $Needle[$needleIndex]) {
                  $matches = $false
                  break
                }
              }
              if ($matches) { return $index }
            }
            return -1
          }

          $bytes = [System.IO.File]::ReadAllBytes($portableExe)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw "Malformed PE: missing MZ header"
          }
          $peOffset = [int](Read-UInt32LE $bytes 0x3c "PE offset")
          if ($peOffset + 24 -gt $bytes.Length -or
              $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
            throw "Malformed PE: missing PE signature"
          }
          $coffOffset = $peOffset + 4
          $optionalSize = [int](Read-UInt16LE $bytes ($coffOffset + 16) "optional-header size")
          $optionalOffset = $coffOffset + 20
          if ($optionalSize -lt 2 -or $optionalOffset + $optionalSize -gt $bytes.Length) {
            throw "Malformed PE: invalid optional header"
          }
          $magic = Read-UInt16LE $bytes $optionalOffset "optional-header magic"
          if ($magic -eq 0x10b) {
            $directoryOffset = 96
            $directoryCountOffset = 92
          } elseif ($magic -eq 0x20b) {
            $directoryOffset = 112
            $directoryCountOffset = 108
          } else {
            throw ("Malformed PE: unsupported optional-header magic 0x{0:x}" -f $magic)
          }
          $debugDirectoryOffset = $optionalOffset + $directoryOffset + (6 * 8)
          if ($optionalSize -lt $directoryOffset + (7 * 8) -or
              (Read-UInt32LE $bytes ($optionalOffset + $directoryCountOffset) "data-directory count") -lt 7 -or
              $debugDirectoryOffset + 8 -gt $bytes.Length) {
            throw "Malformed PE: debug data directory is unavailable"
          }
          $debugRva = Read-UInt32LE $bytes $debugDirectoryOffset "debug RVA"
          $debugSize = Read-UInt32LE $bytes ($debugDirectoryOffset + 4) "debug size"
          if ($debugRva -ne 0 -or $debugSize -ne 0) {
            throw ("Portable EXE retains PE debug directory: RVA=0x{0:x}, Size={1}" -f $debugRva, $debugSize)
          }
          Write-Output "PE debug directory is absent (RVA=0, Size=0)."

          # Use the dynamically located objdump as an independent PE parse check.
          $null = & $objdump --private-headers $portableExe
          if ($LASTEXITCODE -ne 0) { throw "llvm-objdump could not parse the stripped portable EXE" }

          # Check raw bytes, rather than logs or decoded source text, for exact
          # ASCII and UTF-8 build-host/workspace markers that must not ship.
          $registry = Join-Path $env:USERPROFILE ".cargo\registry\src"
          $workspaceParent = Split-Path $env:GITHUB_WORKSPACE -Parent
          $forbiddenMarkers = @(
            "C:\Users\runneradmin",
            "D:\a\filego",
            $env:GITHUB_WORKSPACE,
            $workspaceParent,
            $registry,
            $env:USERPROFILE
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique
          $encodings = @(
            @{ Name = "ASCII"; Value = [System.Text.Encoding]::ASCII },
            @{ Name = "UTF-8"; Value = [System.Text.UTF8Encoding]::new($false) }
          )
          foreach ($marker in $forbiddenMarkers) {
            foreach ($encoding in $encodings) {
              $offset = Find-ByteSequence $bytes $encoding.Value.GetBytes($marker)
              if ($offset -ge 0) {
                throw "Portable EXE contains forbidden $($encoding.Name) build-host marker '$marker' at byte offset $offset"
              }
            }
          }
          Write-Output "No forbidden build-host markers found in the portable EXE."

          $actualVersion = (& $portableExe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne "FileGo $env:VERSION") {
            throw "Stripped portable EXE version mismatch: '$actualVersion'"
          }
          Write-Output "Stripped portable EXE version: $actualVersion"

      - name: Package unsigned candidate
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $exe = "FileGo-$env:VERSION-windows-x86_64.exe"
          $staging = "dist\staging\FileGo-$env:VERSION-windows-x86_64"
          $folder = "dist\FileGo-$env:VERSION-windows-x86_64"
          if (-not (Test-Path "$staging\FileGo.exe" -PathType Leaf)) {
            throw "Verified stripped portable EXE is missing from staging"
          }
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item "$staging\FileGo.exe" "dist\$exe"
          Copy-Item "dist\$exe" "$folder\FileGo.exe"
          Copy-Item "README.md", "LICENSE", "THIRD_PARTY_LICENSES.html" $folder
          if (Get-ChildItem -Path $folder -Filter "*.pdb" -File -Recurse) {
            throw "PDB found in final package staging"
          }
          New-Item -ItemType Directory -Path "$folder\licenses\slint" -Force | Out-Null
          Copy-Item "third-party\slint\LicenseRef-Slint-Royalty-free-2.0.md" "$folder\licenses\slint"
          if (-not (Test-Path "third-party\slint\LicenseRef-Slint-Royalty-free-2.0.md" -PathType Leaf)) { throw "Slint license source is missing" }
          if (-not (Test-Path "$folder\licenses\slint\LicenseRef-Slint-Royalty-free-2.0.md" -PathType Leaf)) { throw "Slint license notice was not copied into the candidate" }
          if (Get-ChildItem -Path $folder -Filter "*.pdb" -File -Recurse) {
            throw "PDB found in final package staging"
          }
          $zip = "dist\FileGo-$env:VERSION-windows-x86_64.zip"
          Compress-Archive -Path "$folder\*" -DestinationPath $zip -CompressionLevel Optimal
          $assets = @("dist\$exe", $zip)
          $lines = foreach ($asset in $assets) {
            (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + (Split-Path $asset -Leaf)
          }
          $lines | Set-Content "dist\FileGo-$env:VERSION-SHA256SUMS.txt" -Encoding ascii

      - name: Upload unsigned candidate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FileGo-${{ inputs.version }}-unsigned-candidate-${{ inputs.candidate_sha }}
          path: |
            dist/FileGo-${{ inputs.version }}-windows-x86_64.exe
            dist/FileGo-${{ inputs.version }}-windows-x86_64.zip
            dist/FileGo-${{ inputs.version }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

# This workflow deliberately has no contents:write permission and no release job.
# Publishing requires the manual acceptance and independent APPROVED_FOR_RELEASE
# evidence specified in CLAUDE.md, followed by a separately authorized action.
